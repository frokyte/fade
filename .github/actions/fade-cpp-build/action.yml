name: Build fade-cpp
description: Build fade-cpp with the provided options.

inputs:
  bin:
    description: Path to the FADE binary.
    required: true
    type: string
  scons-flags:
    description: Additional SCons flags.
    type: string
  scons-cache:
    description: The SCons cache path.
    default: ${{ github.workspace }}/.scons_cache/
    type: string
  fade-cpp-branch:
    description: The fade-cpp branch.
    default: master
    type: string

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive
        repository: fadeengine/fade-cpp
        ref: ${{ inputs.fade-cpp-branch }}
        path: fade-cpp

    - name: Extract API
      shell: sh
      run: ${{ inputs.bin }} --headless --dump-gdextension-interface --dump-extension-api

    - name: SCons Build
      shell: sh
      env:
        SCONS_CACHE: ${{ inputs.scons-cache }}
      run: scons --directory=./fade-cpp/test "gdextension_dir=${{ github.workspace }}" ${{ inputs.scons-flags }}
